<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semion</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <header>
            <h1>Semion - SML Demonstration</h1>
        </header>

        <div id="chatbox"></div>

        <div id="status">
            Ready
        </div>

        <div id="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button onclick="processInput()">
                Send
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
